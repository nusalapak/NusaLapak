<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NusaLapak - Etalase Digital UMKM</title>
  <meta name="description" content="NusaLapak: etalase & katalog digital untuk UMKM. Pesanan langsung masuk ke WhatsApp.">
  <meta name="theme-color" content="#FFC83D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: '#1B1A17',
            kunyit: { DEFAULT: '#FFC83D', 600: '#E8AE12' },
            sambal: { DEFAULT: '#E2341D', 700: '#BF2814' },
            pandan: { DEFAULT: '#0F6B4F', 50: '#E7F3EE', 700: '#0B5640' },
            // warna lama (emerald) dialihkan ke hijau pandan agar dasbor ikut serasi
            emerald: { 50: '#E7F3EE', 100: '#CFE8DE', 500: '#14815F', 600: '#0F6B4F', 700: '#0B5640', 800: '#08402F' },
          },
        },
      },
    };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      background: #F7F7F4;
      color: #1B1A17;
      -webkit-font-smoothing: antialiased;
    }
    .font-display { letter-spacing: -0.025em; }
    :focus-visible { outline: 3px solid #1B1A17; outline-offset: 2px; }

    /* Tombol ala sablon: garis tebal + bayangan keras */
    .sticker {
      border: 2px solid #1B1A17;
      box-shadow: 3px 3px 0 #1B1A17;
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .sticker:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1B1A17; }
    .sticker:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #1B1A17; }
    .sticker:disabled { opacity: .5; pointer-events: none; }
    .tile { transition: transform .1s ease, box-shadow .1s ease; box-shadow: 4px 4px 0 #1B1A17; }
    .tile:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #1B1A17; }

    /* Tenda warung */
    .awning { height: 28px; background: repeating-linear-gradient(90deg, #E2341D 0 24px, #fff 24px 48px); }
    .awning-edge {
      height: 12px;
      background: repeating-linear-gradient(90deg, #E2341D 0 24px, #fff 24px 48px);
      -webkit-mask: radial-gradient(circle at 12px 0, #000 11.5px, transparent 12.5px) 0 0 / 24px 12px repeat-x;
      mask: radial-gradient(circle at 12px 0, #000 11.5px, transparent 12.5px) 0 0 / 24px 12px repeat-x;
    }

    /* Label harga */
    .price-tag {
      display: inline-block;
      background: #FFC83D;
      color: #1B1A17;
      font-weight: 800;
      font-size: .875rem;
      padding: 3px 10px 3px 18px;
      clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%);
    }

    /* Nota pesanan di hero */
    .nota-wrap {
      position: relative;
      max-width: 340px;
      margin-inline: auto;
      transform: rotate(2deg);
      filter: drop-shadow(5px 6px 0 #1B1A17);
      animation: cetak 1.5s steps(24, end) both;
    }
    .zigzag {
      height: 10px;
      background: #fff;
      -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 20px 100%;
      mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 20px 100%;
    }
    .stamp {
      position: absolute;
      right: -10px;
      bottom: 28px;
      transform: rotate(-8deg);
      border: 3px solid #0F6B4F;
      color: #0F6B4F;
      background: rgba(255, 255, 255, .92);
      border-radius: 8px;
      padding: 2px 10px;
      font-weight: 800;
      font-size: .8rem;
      animation: cap .3s ease-out 1.5s both;
    }
    @keyframes cetak {
      from { clip-path: inset(0 -20px 100% -20px); }
      to   { clip-path: inset(0 -20px -20px -20px); }
    }
    @keyframes cap {
      from { opacity: 0; transform: rotate(-8deg) scale(1.7); }
      to   { opacity: 1; transform: rotate(-8deg) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .nota-wrap, .stamp { animation: none; }
      .sticker, .tile { transition: none; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header id="nav" class="bg-white border-b-2 border-ink sticky top-0 z-40"></header>
  <main id="app" class="flex-1"></main>
  <footer class="bg-ink text-white/70 text-sm">
    <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between">
      <span class="font-display font-bold text-white text-lg">NusaLapak</span>
      <span>&copy; <span id="year"></span> NusaLapak. Etalase digital untuk UMKM Indonesia.</span>
    </div>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script type="module" src="./app.js"></script>
</body>
</html>
